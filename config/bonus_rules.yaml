# Betronix - Bonus Onay/Ret Kuralları
# =====================================
# Her bonus türü için kurallar yukarıdan aşağıya değerlendirilir.
# İlk eşleşen kural uygulanır. Eşleşme yoksa default_action uygulanır.
#
# Kullanılabilir profil alanları:
#   bakiye, bonus_bakiye, toplam_yatirim, toplam_cekim, kar_zarar,
#   son_yatirim_tutari, yatirim_sayisi, cekim_sayisi,
#   kayit_gunu_farki, son_yatirim_gunu_farki, son_yatirim_saat_farki,
#   hesap_aktif (true/false), aktif_bonus_var (true/false),
#   basarili_yatirim_var, son_24_saat_yatirim_var, son_5_saat_yatirim_var,
#   kripto_yatirim_var, son_kripto_yatirim_tutari,
#   son_7_gun_yatirim_toplami, son_7_gun_cekim_toplami, son_7_gun_net_kayip,
#   son_36_saat_yatirim_sayisi, son_36_saat_en_dusuk_yatirim,
#   hosgeldin_onay_sayisi, son_yatirimdan_sonra_ilk_kayip_var,
#   son_kullanilan_bonus, durum, aktif_bonus
#
# Operatörler: ==, !=, >, >=, <, <=, in, not_in, contains, between
#
# Hesaplama yöntemleri:
#   percentage: yatırımın yüzdesi (base_field * percentage / 100, min/max sınırlı)
#   fixed: sabit miktar
#   tiered: kademe tablosu

bonus_types:

  # ============================================================
  # 1. İlk Yatırıma Özel %100 Kayıp Bonusu
  # ============================================================
  ilk_kaybiniza_ozel_nakit_iade_bonusu:
    display_name: "İlk Yatırıma Özel %100 Kayıp Bonusu"
    default_action: reject
    default_reject_message_key: "ilk_kayip_genel_ret"
    rules:
      - name: "Aktif bonus mevcut"
        conditions:
          - field: "aktif_bonus_var"
            operator: "=="
            value: true
        action: reject
        reject_message_key: "aktif_bonus_mevcut"

      - name: "Hiç yatırım yok"
        conditions:
          - field: "basarili_yatirim_var"
            operator: "=="
            value: false
        action: reject
        reject_message_key: "ilk_kayip_yatirim_yok"

      - name: "Birden fazla yatırım"
        conditions:
          - field: "yatirim_sayisi"
            operator: ">"
            value: 1
        action: reject
        reject_message_key: "ilk_kayip_yatirim_yok"

      - name: "Yatırım 2+ gün eski"
        conditions:
          - field: "son_yatirim_gunu_farki"
            operator: ">"
            value: 1
        action: reject
        reject_message_key: "ilk_kayip_yatirim_yok"

      - name: "Bakiye 5 TL üstünde"
        conditions:
          - field: "bakiye"
            operator: ">="
            value: 5
        action: reject
        reject_message_key: "ilk_kayip_bakiye_yuksek"

      - name: "Yatırım tutarı 100 TL altında"
        conditions:
          - field: "son_yatirim_tutari"
            operator: "<"
            value: 100
        action: reject
        reject_message_key: "ilk_kayip_genel_ret"

      - name: "Yatırım tutarı 1000 TL üstünde"
        conditions:
          - field: "son_yatirim_tutari"
            operator: ">"
            value: 1000
        action: reject
        reject_message_key: "ilk_kayip_genel_ret"

      - name: "İlk yatırım kayıp - onay"
        conditions:
          - field: "aktif_bonus_var"
            operator: "=="
            value: false
          - field: "yatirim_sayisi"
            operator: "=="
            value: 1
          - field: "bakiye"
            operator: "<"
            value: 5
          - field: "son_yatirim_gunu_farki"
            operator: "<="
            value: 1
          - field: "son_yatirim_tutari"
            operator: ">="
            value: 100
          - field: "son_yatirim_tutari"
            operator: "<="
            value: 1000
        action: approve
        bonus_calculation:
          method: "percentage"
          base_field: "son_yatirim_tutari"
          percentage: 100
          min_amount: 100
          max_amount: 1000
          turnover: 5

  # ============================================================
  # 2. %300 Hoşgeldin Bonusu (kademe sistemi)
  # ============================================================
  hosgeldin_bonusu:
    display_name: "%300 Hoşgeldin Bonusu"
    default_action: reject
    default_reject_message_key: "hosgeldin_genel_ret"
    rules:
      - name: "Son 5 saatte yatırım yok"
        conditions:
          - field: "son_5_saat_yatirim_var"
            operator: "=="
            value: false
        action: reject
        reject_message_key: "hosgeldin_yatirim_yok"

      - name: "3 kez onay almış - limit doldu"
        conditions:
          - field: "hosgeldin_onay_sayisi"
            operator: ">="
            value: 3
        action: reject
        reject_message_key: "hosgeldin_limit_doldu"

      - name: "1. kademe - ilk onay (%50)"
        conditions:
          - field: "son_5_saat_yatirim_var"
            operator: "=="
            value: true
          - field: "hosgeldin_onay_sayisi"
            operator: "=="
            value: 0
        action: approve
        bonus_calculation:
          method: "percentage"
          base_field: "son_yatirim_tutari"
          percentage: 50
          turnover: 10

      - name: "2. kademe - ikinci onay (%100)"
        conditions:
          - field: "son_5_saat_yatirim_var"
            operator: "=="
            value: true
          - field: "hosgeldin_onay_sayisi"
            operator: "=="
            value: 1
        action: approve
        bonus_calculation:
          method: "percentage"
          base_field: "son_yatirim_tutari"
          percentage: 100
          turnover: 10

      - name: "3. kademe - üçüncü onay (%150)"
        conditions:
          - field: "son_5_saat_yatirim_var"
            operator: "=="
            value: true
          - field: "hosgeldin_onay_sayisi"
            operator: "=="
            value: 2
        action: approve
        bonus_calculation:
          method: "percentage"
          base_field: "son_yatirim_tutari"
          percentage: 150
          turnover: 10

  # ============================================================
  # 3. %25 Anlık Kayıp Bonusu
  # ============================================================
  anlik_kayip_bonusu:
    display_name: "%25 Anlık Kayıp Bonusu"
    default_action: reject
    default_reject_message_key: "anlik_kayip_genel_ret"
    rules:
      - name: "Hiç yatırım yok"
        conditions:
          - field: "basarili_yatirim_var"
            operator: "=="
            value: false
        action: reject
        reject_message_key: "anlik_kayip_yatirim_yok"

      - name: "Yatırım 24 saatten eski"
        conditions:
          - field: "son_24_saat_yatirim_var"
            operator: "=="
            value: false
        action: reject
        reject_message_key: "anlik_kayip_tarih_gecmis"

      - name: "Bakiye 5 TL üstünde"
        conditions:
          - field: "son_24_saat_yatirim_var"
            operator: "=="
            value: true
          - field: "bakiye"
            operator: ">="
            value: 5
        action: reject
        reject_message_key: "anlik_kayip_bakiye_yuksek"

      - name: "Son yatırımdan sonra ilk kayıp bonusu almış"
        conditions:
          - field: "son_24_saat_yatirim_var"
            operator: "=="
            value: true
          - field: "bakiye"
            operator: "<"
            value: 5
          - field: "son_yatirimdan_sonra_ilk_kayip_var"
            operator: "=="
            value: true
        action: reject
        reject_message_key: "anlik_kayip_ilk_kayip_almis"

      - name: "Anlık kayıp onay"
        conditions:
          - field: "son_24_saat_yatirim_var"
            operator: "=="
            value: true
          - field: "bakiye"
            operator: "<"
            value: 5
          - field: "son_yatirimdan_sonra_ilk_kayip_var"
            operator: "=="
            value: false
        action: approve
        bonus_calculation:
          method: "percentage"
          base_field: "son_yatirim_tutari"
          percentage: 25
          turnover: 1

  # ============================================================
  # 4. Haftalık %10 Kayıp Bonusu
  # ============================================================
  haftalik_kayip_bonusu:
    display_name: "Haftalık %10 Kayıp Bonusu"
    default_action: reject
    default_reject_message_key: "haftalik_kayip_genel_ret"
    rules:
      - name: "Hiç yatırım yok"
        conditions:
          - field: "basarili_yatirim_var"
            operator: "=="
            value: false
        action: reject
        reject_message_key: "haftalik_kayip_yatirim_yok"

      - name: "Net kayıp yok - kâr yapmış"
        conditions:
          - field: "son_7_gun_net_kayip"
            operator: "<="
            value: 0
        action: reject
        reject_message_key: "haftalik_kayip_kar_yapmis"

      - name: "Haftalık kayıp onay"
        conditions:
          - field: "basarili_yatirim_var"
            operator: "=="
            value: true
          - field: "son_7_gun_net_kayip"
            operator: ">"
            value: 0
        action: approve
        bonus_calculation:
          method: "percentage"
          base_field: "son_7_gun_net_kayip"
          percentage: 10
          turnover: 30

  # ============================================================
  # 5. %15 Kripto Yatırım Bonusu
  # ============================================================
  kripto_yatirim_bonusu:
    display_name: "%15 Kripto Yatırım Bonusu"
    default_action: reject
    default_reject_message_key: "kripto_yatirim_yok"
    rules:
      - name: "Kripto yatırımı yok"
        conditions:
          - field: "kripto_yatirim_var"
            operator: "=="
            value: false
        action: reject
        reject_message_key: "kripto_yatirim_yok"

      - name: "Kripto yatırım onay"
        conditions:
          - field: "kripto_yatirim_var"
            operator: "=="
            value: true
        action: approve
        bonus_calculation:
          method: "percentage"
          base_field: "son_kripto_yatirim_tutari"
          percentage: 15
          turnover: 1

  # ============================================================
  # 6. %50 Nakit Jest Bonusu
  # ============================================================
  nakit_jest_bonusu:
    display_name: "%50 Nakit Jest Bonusu"
    default_action: reject
    default_reject_message_key: "nakit_jest_genel_ret"
    rules:
      - name: "Hiç yatırım yok"
        conditions:
          - field: "basarili_yatirim_var"
            operator: "=="
            value: false
        action: reject
        reject_message_key: "nakit_jest_yatirim_yok"

      - name: "36 saatte 4 yatırım yok"
        conditions:
          - field: "son_36_saat_yatirim_sayisi"
            operator: "<"
            value: 4
        action: reject
        reject_message_key: "nakit_jest_yetersiz_yatirim"

      - name: "Nakit jest onay - 4+ yatırım"
        conditions:
          - field: "son_36_saat_yatirim_sayisi"
            operator: ">="
            value: 4
        action: approve
        bonus_calculation:
          method: "percentage"
          base_field: "son_36_saat_en_dusuk_yatirim"
          percentage: 50
          turnover: 6

  # ============================================================
  # 7. %20 Spor Kayıp Bonusu (direkt onay)
  # ============================================================
  spor_kayip_bonusu:
    display_name: "%20 Spor Kayıp Bonusu"
    default_action: approve
    default_reject_message_key: "genel_uygun_degil"
    rules: []

  # ============================================================
  # 8. Çevrimsiz 2X Yap 5X Çek (direkt onay)
  # ============================================================
  cevrimsiz_2x_yap_5x_cek:
    display_name: "Çevrimsiz 2X Yap 5X Çek"
    default_action: approve
    default_reject_message_key: "genel_uygun_degil"
    rules: []

  # ============================================================
  # Tanınmayan bonus türleri
  # ============================================================
  _unknown:
    display_name: "Bilinmeyen Bonus"
    default_action: reject
    default_reject_message_key: "bilinmeyen_bonus"
