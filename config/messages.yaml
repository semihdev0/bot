# Betronix - Ret Mesajı Şablonları
# ==================================
# Bot reddetme sırasında bu mesajları kullanır.
# Kurallar dosyasındaki reject_message_key ile eşleşir.

rejection_messages:

  genel_uygun_degil: >
    Bonus talebiniz incelenmiş olup mevcut koşulları karşılamamaktadır.
    Detaylı bilgi için canlı destek hattımızdan bilgi alabilirsiniz.

  yatirim_yetersiz: >
    Yatırım tutarınız bu bonus için gerekli minimum tutarı karşılamamaktadır.
    Lütfen yeterli tutarda yatırım yaparak tekrar deneyiniz.

  hesap_eski: >
    Bu bonus yalnızca yeni kayıt olan kullanıcılar için geçerlidir.
    Diğer promosyonlarımız için kampanya sayfamızı inceleyebilirsiniz.

  bakiye_yuksek: >
    Mevcut bakiyeniz bu bonus türü için eşik değerin üzerindedir.

  aktif_bonus_mevcut: >
    Hesabınızda aktif bir bonus bulunmaktadır.
    Mevcut bonusunuz tamamlandıktan sonra yeni bonus talebinde bulunabilirsiniz.

  bilinmeyen_bonus: >
    Bu bonus türü otomatik olarak işlenememektedir.
    Talebiniz manuel inceleme için yöneticiye iletilecektir.

  hesap_pasif: >
    Hesabınız aktif durumda değildir.
    Lütfen müşteri hizmetleri ile iletişime geçiniz.
